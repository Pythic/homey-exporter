# homey-exporter + VictoriaMetrics (Prometheus-compatible, 5 years retention) + Grafana.
#
#   cp .env.example .env          # fill in HOMEY_URL and HOMEY_TOKEN (chmod 600 .env)
#   docker compose up -d
#   http://<host>:9414/metrics    exporter
#   http://<host>:8428            VictoriaMetrics (vmui at /vmui)
#   http://<host>:3000            Grafana, login admin/admin, data source is pre-provisioned
services:
  homey-exporter:
    image: ghcr.io/pythic/homey-exporter:latest
    container_name: homey-exporter
    restart: unless-stopped
    env_file: .env
    ports:
      - "9414:9414"
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    command: ["-retentionPeriod=5y", "-promscrape.config=/etc/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus.yml:ro
      - vmdata:/victoria-metrics-data
    ports:
      - "8428:8428"
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/victoriametrics.yml:ro
      - grafana:/var/lib/grafana
    ports:
      - "3000:3000"
volumes:
  vmdata:
  grafana:
